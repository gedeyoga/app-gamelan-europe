server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Same-origin API proxy: browser calls /api/v1 on the app host,
    # nginx forwards to backend-app on the internal Docker network.
    # Backend global prefix is `api/v1` (backend/apps/app/src/main.ts).
    # Do NOT add a trailing slash to proxy_pass — it must preserve the path.
    location /api/ {
        proxy_pass http://backend-app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
