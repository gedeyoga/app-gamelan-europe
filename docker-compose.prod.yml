# Production deploy — server-managed Traefik edge proxy + GHCR images.
#
# Required .env keys (repo root or shell env):
#   BASE_DOMAIN            zone serving the stack, e.g. namadomain.com
#                          → frontend  app.<BASE_DOMAIN>
#                          → backend   api.<BASE_DOMAIN>
# Optional:
#   IMAGE_PREFIX           default ghcr.io/gedeyoga/app-gamelan-europe
#   IMAGE_TAG              default latest
#   TRAEFIK_CERTRESOLVER   default letsencrypt
#   BACKEND_ENV_FILE       optional, default ./backend/.env
#
# Postgres/Redis are server-managed; this file does NOT run them.
# Ensure DATABASE_URL and REDIS_URL in backend/.env point to them.
#
# WARNING: the prod env file must NOT use `localhost` for these keys:
#   DATABASE_URL, REDIS_URL, S3_ENDPOINT, S3_PUBLIC_BASE_URL
# (S3_PUBLIC_BASE_URL is browser-facing; the rest are container-facing.)
#
# The browser calls the backend cross-origin at https://api.<BASE_DOMAIN>/api/v1
# (injected into the frontend at container start via VITE_API_BASE_URL); the
# frontend nginx no longer proxies /api/. CORS is therefore required: backend-app
# is given CORS_ORIGINS=https://app.<BASE_DOMAIN>, credentials stay off (bearer
# tokens in localStorage, no cookies).
#
# pgbouncer is reached over the external `traefik` network, which
# backend-app and backend-worker join; postgres itself is intentionally
# not reachable from the app stack (isolation model).
#
# Update: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

name: gamelan-europe

services:
  backend-app:
    image: ${IMAGE_PREFIX:-ghcr.io/gedeyoga/app-gamelan-europe}/backend-app:${IMAGE_TAG:-latest}
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      CORS_ORIGINS: "https://app.${BASE_DOMAIN:?BASE_DOMAIN is required}"
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - internal
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.gamelan-api.rule=Host(`api.${BASE_DOMAIN:?BASE_DOMAIN is required}`)'
      - 'traefik.http.routers.gamelan-api.entrypoints=websecure'
      - 'traefik.http.routers.gamelan-api.tls=true'
      - 'traefik.http.routers.gamelan-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
      - 'traefik.http.services.gamelan-api.loadbalancer.server.port=3001'
      - 'traefik.http.middlewares.gamelan-api-compress.compress=true'
      - 'traefik.http.routers.gamelan-api.middlewares=gamelan-api-compress'
      # Optional HTTP->HTTPS redirect (Traefik often handles this globally):
      # - 'traefik.http.routers.gamelan-api.middlewares=gamelan-redirect'
      # - 'traefik.http.middlewares.gamelan-redirect.redirectscheme.scheme=https'

  backend-worker:
    image: ${IMAGE_PREFIX:-ghcr.io/gedeyoga/app-gamelan-europe}/backend-worker:${IMAGE_TAG:-latest}
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    restart: unless-stopped
    networks:
      - internal
      - traefik
    # No public HTTP endpoint: worker only calls app.listen(3002), exposes no controllers.
    # Router left ready but disabled; uncomment if a real HTTP API is added.
    labels:
      - 'traefik.enable=false'
    # labels:
    #   - 'traefik.enable=true'
    #   - 'traefik.docker.network=traefik'
    #   - 'traefik.http.routers.gamelan-worker.rule=Host(`worker.${BASE_DOMAIN}`)'
    #   - 'traefik.http.routers.gamelan-worker.entrypoints=websecure'
    #   - 'traefik.http.routers.gamelan-worker.tls=true'
    #   - 'traefik.http.routers.gamelan-worker.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
    #   - 'traefik.http.services.gamelan-worker.loadbalancer.server.port=3002'

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/gedeyoga/app-gamelan-europe}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: "https://api.${BASE_DOMAIN:?BASE_DOMAIN is required}/api/v1"
    expose:
      - "80"
    networks:
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.gamelan-web.rule=Host(`app.${BASE_DOMAIN:?BASE_DOMAIN is required}`)'
      - 'traefik.http.routers.gamelan-web.entrypoints=websecure'
      - 'traefik.http.routers.gamelan-web.tls=true'
      - 'traefik.http.routers.gamelan-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
      - 'traefik.http.services.gamelan-web.loadbalancer.server.port=80'
      - 'traefik.http.middlewares.gamelan-compress.compress=true'
      - 'traefik.http.routers.gamelan-web.middlewares=gamelan-compress'
      # Optional HTTP->HTTPS redirect (Traefik often handles this globally):
      # - 'traefik.http.routers.gamelan-web.middlewares=gamelan-redirect'
      # - 'traefik.http.middlewares.gamelan-redirect.redirectscheme.scheme=https'

networks:
  traefik:
    external: true
    name: traefik
  internal:
    driver: bridge
