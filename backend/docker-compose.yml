name: trade-backend

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: trade-api
    ports:
      - "3001:3001"
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: trade-worker
    ports:
      - "3002:3002"
    env_file:
      - .env
    restart: unless-stopped