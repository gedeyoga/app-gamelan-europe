      operationId: listArchives
      summary: List archives (paginated)
      description: |
        Permission `archive:read`. Row-level scoping applied server-side.
        `GET /archives` is the backend resource for the UI "Archives" menu.

        Member-only rows (`type=MEMBER`) have `externalLinks` set to `null` when the
        caller lacks member access (`canViewPrivate=false`).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/ArchiveSortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - $ref: '#/components/parameters/SearchParam'
