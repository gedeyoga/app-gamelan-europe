          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /story-submissions/images:
    post:
      tags: [StorySubmissions]
      operationId: uploadStorySubmissionImage
      summary: Upload a submission gallery/flyer image (public)
      description: |
        **Public** (`@Public()`, no `x-api-key` required, anonymous).
        `multipart/form-data` with field `file` (mime `image/png` | `image/jpeg`
        | `image/webp`, max `UPLOAD_MAX_SIZE_MB`, default 5 MB). Resized/compressed
        synchronously via `sharp`. Used for both gallery and flyer images.

        `entityType` is **hardcoded server-side** to `story-submission` and is
        never read from the request body. The returned `id` is later sent in
        `galleryImageIds` / `flyerImageIds` of `POST /story-submissions`.
        Rate-limited per IP to **10 requests/minute** → **429** on excess.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Allowed mime types: `image/png`, `image/jpeg`, `image/webp`. Max size `UPLOAD_MAX_SIZE_MB` (default 5 MB).'
      responses:
        '201':
          description: Uploaded image metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /story-submissions/categories:
    get:
      tags: [StorySubmissions]
      operationId: listStorySubmissionCategories
      summary: List STORY categories for the public form
      description: |
        **Public** (`@Public()`, no `x-api-key` required) — reference data for the
        public story-submission form. Returns the `STORY` categories ordered by
        `name` (max 100), shaped as `{ id, name }`. Not gated by `category:read`.
      security: []
      responses:
        '200':
          description: STORY categories for the submission form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorySubmissionCategoryListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

