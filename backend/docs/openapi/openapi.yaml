      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Allowed mime types: `image/png`, `image/jpeg`, `image/webp`. Max size `UPLOAD_MAX_SIZE_MB` (default 5 MB).'
      responses:
