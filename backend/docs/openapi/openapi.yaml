openapi: 3.1.0
info:
  title: Gamelan Europe — Story & Event API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Static OpenAPI 3.1.0 contract for the Story (`post`), Category, Event,
    EventType, Network, Archive, Document, Image and City
    endpoints of the NestJS backend.

    All endpoints require the `x-api-key` header (global `JwtAuthGuard`) and are
    further gated by RBAC permissions attached to the key. JWT login is internal
    and out of scope for this spec.

    **Public endpoints** are exempt from `x-api-key` (`@Public()`) and override the
    global `security` with `security: []`: `POST /event-submissions`,
    `POST /event-submissions/thumbnail`, `POST /archive-submissions`,
    `POST /archive-submissions/thumbnail`, `POST /archive-submissions/attachments`,
    `POST /story-submissions`, `POST /story-submissions/thumbnail`,
    `POST /story-submissions/images`, `GET /story-submissions/categories`,
    `POST /network-submissions`,
    `GET /event-types`, `GET /countries`, `GET /countries/{id}`, `GET /states`,
    `GET /states/{id}`, `GET /cities`, `GET /cities/{id}`, `GET /stats/summary`.
    `POST /cities` is **not** public: it requires the `city:create` permission and
    is idempotent by `name` (case-insensitive) + `countryId`/`stateId`.
    The public submission **create**
    endpoints (`POST /event-submissions`, `POST /archive-submissions`,
    `POST /story-submissions`, `POST /network-submissions`) are rate-limited
    per IP to **5 requests/minute**
    (`429` on excess) — as are the public upload endpoints
    (`POST /archive-submissions/thumbnail`, `POST /archive-submissions/attachments`,
    `POST /event-submissions/thumbnail`, `POST /story-submissions/thumbnail`,
    `POST /story-submissions/images`), which are rate-limited to
    **10 requests/minute**. All public upload endpoints additionally accept
    **at most 10 files** per request (multipart field `files`).

    `story-submission` `content` is sanitized server-side with a strict allowlist
    before it is stored, and the global JSON body limit is `1mb` (larger JSON
    receives `413`; multipart uploads are unaffected).

    ## Response envelope
    - Success (single): `{ data: <T>, message: "success" }`
    - Success (list):   `{ data: [<T>], meta: { page, limit, total }, message: "success" }`
    - Error:            `{ statusCode, message, errors: [] }`
    - Validation (422): `{ statusCode: 422, message: "Validation failed", errors: [{ field, message }] }`

    Global prefix: `/api/v1`. Global `ValidationPipe` uses `whitelist` +
    `forbidNonWhitelisted` + `transform`, so unknown body/query fields → 422.
servers:
  - url: https://api.europeangamelansociety.com/api/v1
    description: Production
tags:
  - name: Story
    description: Posts (backend resource `post`, UI label Story) + status transitions.
  - name: Categories
    description: Story/archive categories. Create is idempotent by `name` + `type`.
  - name: Events
    description: Events + status transitions.
  - name: EventTypes
    description: Event type taxonomy. `GET` is public (dropdown for the submission form). Create is idempotent by `name`. No GET detail endpoint; `DELETE /event-types/{id}` removes a type.
  - name: EventSubmissions
    description: |
      Public event submissions (no account). `POST` writes directly to `events`
      with `status=REQUEST`, `source=PUBLIC`; admins review via the `Events`
      module.
  - name: ArchiveSubmissions
    description: |
      Archive proposals submitted by the public (no account). Admins review the
      queue; approve recreates an `Archive` with `status=DRAFT` (not published).
  - name: StorySubmissions
    description: |
      Public story submissions (no account), including a required `submitter`
      contact section and rich `content` (sanitized server-side). `POST` writes
      directly to `posts` with `status=REQUEST`, `source=PUBLIC`; admins review
      via the `Story` module.
  - name: NetworkSubmissions
    description: |
      Public network submissions (no account) — organisations join the Network
      Map. Anonymous `POST` writes **directly to the `networks` table** with
      `status=REQUEST`, `source=PUBLIC` (mirroring the archive/event/story
      submission pattern). Admins review via `GET /networks?filter[status]=REQUEST`,
      approve via `network:approve` (`POST /networks/{id}/approve`, flips to
      `PUBLISHED` + `publishedAt`) and reject via `network:reject`
      (`POST /networks/{id}/reject`, back to `DRAFT`). A provided `mapsUrl` is
      resolved server-side to `lat`/`lng`.
  - name: Networks
    description: |
      Networks (admin-only). Also the review queue for public submissions
      (`filter[status]=REQUEST`). Used as the row-level scoping boundary for
      network users. No row-level scoping in this module.
  - name: Images
    description: S3 image upload (multipart).
  - name: Archives
    description: |
      Archives + status transitions. `GET /archives` is the backend resource for
      the UI "Archives" menu.
  - name: Documents
    description: PDF document upload (multipart); bound to archives via `documentIds`.
  - name: Countries
    description: |
      Public geo reference data (read-only, source dr5hn/countries-states-cities-database).
      No create/update/delete; served from the seeded `Country` table.
  - name: States
    description: |
      Public geo reference data (read-only, source dr5hn/countries-states-cities-database).
      No create/update/delete; served from the seeded `State` table.
  - name: Cities
    description: |
      Geo reference data (read-only list/detail, source dr5hn). `POST /cities`
      idempotent (`city:create`) untuk find-or-create dari form event.
  - name: Stats
    description: "Ringkasan publik: event published, user aktif, jumlah negara terlibat."
  - name: Subscriptions
    description: |
      Subscription packages (admin CRUD, soft-delete). `price` is a Prisma
      `Decimal` serialized as a `number`; `subscriberCount` is a computed field
      (unique users holding a `PAID` `Billing` for that package). Soft-deleted
      rows (`deletedAt != null`) are never returned.
security:
  - apiKeyAuth: []
paths:
  /posts:
    get:
      tags: [Story]
      operationId: listPosts
      summary: List posts (paginated)
      description: |
        Permission `story:read`. Row-level scoping applied server-side
        (`all` / `network` / `published` / `none`).

        Member-only (`visibility=PRIVATE`) rows are never returned to callers lacking
        member access — the list filters them out.

        Filter by status with `filter[status]` (e.g. `filter[status]=PUBLISHED`);
        see the `filter` parameter for the full set of allowed keys.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/PostSortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PostFilterParam'
      responses:
        '200':
          description: Paginated list of posts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Story]
      operationId: createPost
      summary: Create post
      description: |
        Permission `story:create`. `slug` optional (auto-generated from `name`
        when omitted). Non-admin scopes cannot force `status`/`publishedAt`
        (forced to `DRAFT`). Sending `publishedAt` forces `status=PUBLISHED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}:
    get:
      tags: [Story]
      operationId: getPost
      summary: Get post by id
      description: |
        Permission `story:read`. Member-only (`visibility=PRIVATE`) rows are never
        returned to callers lacking member access — detail returns 403.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Post detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Story]
      operationId: updatePost
      summary: Update post
      description: |
        Permission `story:update`. Sending `slug` explicitly that collides → 409.
        `thumbnail: null` clears the thumbnail. `publishedAt` overrides `status`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Post updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Story]
      operationId: deletePost
      summary: Delete post
      description: Permission `story:delete`. Deletes bound image metadata + S3 objects (best effort).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted post (resolved gallery/flyer included).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/submit:
    post:
      tags: [Story]
      operationId: submitPost
      summary: Submit post for review (DRAFT → REQUEST)
      description: Permission `story:submit`. Invalid current status → 409.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/approve:
    post:
      tags: [Story]
      operationId: approvePost
      summary: Approve & publish post (REQUEST → PUBLISHED)
      description: Permission `story:approve`. Optional JSON body `{ publishedAt? }` (ISO8601). Invalid current status → 409; invalid body → 422.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishContentRequest'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/reject:
    post:
      tags: [Story]
      operationId: rejectPost
      summary: Reject post (REQUEST → DRAFT)
      description: Permission `story:reject`. Invalid current status → 409.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/publish:
    post:
      tags: [Story]
      operationId: publishPost
      summary: Publish post (APPROVED → PUBLISHED)
      description: Permission `story:publish`. Optional JSON body `{ publishedAt? }` (ISO8601). Invalid current status → 409; invalid body → 422.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishContentRequest'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/unpublish:
    post:
      tags: [Story]
      operationId: unpublishPost
      summary: Unpublish post (PUBLISHED → DRAFT)
      description: Permission `story:unpublish`. Invalid current status → 409.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories (paginated)
      description: Permission `category:read`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CategorySortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/CategoryFilterParam'
      responses:
        '200':
          description: Paginated list of categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create category (idempotent)
      description: |
        Permission `category:create`. Idempotent: same `name`
        (case-insensitive) + `type` returns the existing category (no 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created (or existing one returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories/{id}:
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Get category by id
      description: Permission `category:read`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Category detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Categories]
      operationId: updateCategory
      summary: Update category
      description: Permission `category:update`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete category
      description: |
        Permission `category:delete`. Cascades `post_categories` links;
        stories are NOT deleted.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events (paginated)
      description: |
        Permission `event:read`. Row-level scoping applied server-side
        (`all` / `network` / `published` / `none`).

        Member-only (`visibility=PRIVATE`) rows are never returned to callers lacking
        member access — the list filters them out.

        Filter by status with `filter[status]` (e.g. `filter[status]=PUBLISHED`);
        see the `filter` parameter for the full set of allowed keys.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/EventSortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/EventFilterParam'
      responses:
        '200':
          description: Paginated list of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create event
      description: |
        Permission `event:create`. `slug` optional (auto-generated from `name`).
        `location` is required. Non-admin scopes cannot force
        `status`/`publishedAt` (forced to `DRAFT`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{id}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get event by id
      description: |
        Permission `event:read`. Member-only (`visibility=PRIVATE`) rows are never
        returned to callers lacking member access — detail returns 403.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Event detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update event
      description: |
        Permission `event:update`. Relation fields (`eventTypeIds`, `dates`,
        `location`) are replace-all when sent. `thumbnail: null` clears it.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Delete event
      description: Permission `event:delete`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{id}/submit:
    post:
      tags: [Events]
      operationId: submitEvent
      summary: Submit event for review (DRAFT → REQUEST)
      description: Permission `event:submit`. Invalid current status → 409.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Event transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{id}/approve:
    post:
