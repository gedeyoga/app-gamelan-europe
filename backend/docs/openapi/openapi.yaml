    get:
      tags: [StorySubmissions]
      operationId: getStorySubmission
      summary: Get story submission by id (admin)
      description: |
        Permission `story-submission:read`. Detail includes `content`,
        `categoryIds` and resolves `gallery` / `flyer` (`ImageResponse[]`) in
        stored order.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Story submission detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorySubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /story-submissions/{id}/approve:
    post:
      tags: [StorySubmissions]
      operationId: approveStorySubmission
      summary: Approve a submission (recreates a DRAFT Post/Story)
      description: |
        Permission `story-submission:approve`. Transitions `REQUEST → APPROVED`
        and atomically **recreates** a `Post` with `status=DRAFT`
        (`publishedAt=null`); it does **not** publish. `content` is re-sanitized
        (defense in depth) and gallery/flyer images are re-owned and bound to the
        new post. The submission is kept as audit (`postId` linked). Already-final
        (`APPROVED`/`REJECTED`) row → **409**. Optional JSON body `{ adminNote? }`;
        invalid body → 422.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewStorySubmissionRequest'
      responses:
        '200':
          description: Submission approved; draft story recreated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorySubmissionApproveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /story-submissions/{id}/reject:
    post:
      tags: [StorySubmissions]
      operationId: rejectStorySubmission
      summary: Reject a submission
      description: |
        Permission `story-submission:reject`. Transitions `REQUEST → REJECTED`
        (no `Post` is created). Already-final row → **409**. Optional JSON body
        `{ adminNote? }`; invalid body → 422.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
