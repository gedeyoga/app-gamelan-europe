  /event-submissions:
    post:
      tags: [EventSubmissions]
      operationId: createEventSubmission
      summary: Create an event submission (public)
      description: |
        **Public** (`@Public()`, no `x-api-key` required, anonymous). Writes
        directly to `events` with `status=REQUEST` and `source=PUBLIC` for admin
        review. Body is validated with the global `ValidationPipe` (`whitelist` +
        `forbidNonWhitelisted` + `transform`), so unknown fields (e.g. `status`,
        `reviewedBy`, `eventId`) → **422**.

        Only a compact `{ id, status }` is returned — the full row is never echoed
        to the anonymous caller. Rate-limited per IP to **5 requests/minute**
        → **429** on excess.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventSubmissionRequest'
      responses:
        '201':
          description: Submission created (`REQUEST`). Returns only `{ id, status }`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMessage'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [id, status]
                        properties:
                          id:
                            type: string
                            format: uuid
                          status:
                            $ref: '#/components/schemas/ContentStatus'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /event-submissions/thumbnail:
    post:
      tags: [EventSubmissions]
      operationId: uploadEventSubmissionThumbnail
      summary: Upload a submission thumbnail (public)
      description: |
        **Public** (`@Public()`, no `x-api-key` required, anonymous).
        `multipart/form-data` with field `files` (**1–10** files per request; per-file
        mime `image/png` | `image/jpeg` | `image/webp`, max `UPLOAD_MAX_SIZE_MB`,
        default 5 MB). Resized/compressed synchronously via `sharp`. Rate-limited
        per IP to **10 requests/minute** → **429** on excess.

        **Breaking change for external consumers:** the request field was `file`
        (single) and the response was a single object; both are now arrays —
        send `files`, receive `data: ImageResponse[]`. At most 10 files may be
        uploaded per request (11+ → `422`).

        **The batch is not atomic:** each file is uploaded independently, so if a
        later file fails, earlier files in the same request may already be stored
        (and can be orphaned); `201` returns one entry per successfully uploaded
        file in request order.

        `entityType` is **hardcoded server-side** to `event` and is
        never read from the request body. The returned `url` of the first item is
        later passed as the `thumbnail` field of `POST /event-submissions`.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                  description: 'Allowed mime types: `image/png`, `image/jpeg`, `image/webp`. Max size `UPLOAD_MAX_SIZE_MB` (default 5 MB) per file. At most 10 files may be sent per request.'
      responses:
        '201':
          description: Uploaded image metadata (one entry per uploaded file, same order as the request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadListResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

