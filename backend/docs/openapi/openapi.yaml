        `Billing`'s subscription for the authenticated user, but only when that
        subscription is `status=ACTIVE` and not soft-deleted; otherwise
        `data: null`. Declared **before** `/subscriptions/{id}` so the literal
        `me` segment is not swallowed by the UUID pipe.
      responses:
        '200':
          description: Current user's subscription, or `null` when none is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionMineResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /subscriptions/available:
    get:
      tags: [Subscriptions]
      operationId: listAvailableSubscriptions
      summary: List available subscription packages (paginated)
      description: |
        **LOGIN-only**. Catalog of non-deleted packages; `status` is **forced**
        to `ACTIVE` (any user-supplied `filter[status]` is overridden), so
        `INACTIVE` packages never appear. Each item carries the computed
        `subscriberCount`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SubscriptionSortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SubscriptionFilterParam'
      responses:
        '200':
          description: Paginated list of active subscription packages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /subscriptions/{id}:
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Get subscription by id
      description: Permission `subscription:read`. Soft-deleted rows → 404. Invalid UUID → 400.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Subscription detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /stats/summary:
    get:
      tags: [Stats]
      operationId: getStatsSummary
      summary: Public stats summary
      description: |
        **Public** (`@Public()`, no `x-api-key` required) — no RBAC. Aggregate
        counts: `events.published` counts `Event` with `status=PUBLISHED` and
        `publishedAt <= now` (`latestPublishedAt` is the newest of those, or
        `null`); `users.active` counts `User` with `status=ACTIVE`;
        `countries.*` counts distinct countries involved — `organization` matches
        `Network.country` against `Country.name` case-insensitively, `total` is
        the distinct union of all four categories.
      security: []
      responses:
        '200':
          description: Stats summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummaryResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Required. Raw API key in the `x-api-key` header, format `gke_<base64url>`
        (e.g. `gke_AbCdEf1234567890abcdefghijklmnopqrstuvwx`). Created via the API
        Key menu; RBAC permissions attach to the key.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Resource UUID (any version). Invalid UUID → 400.
      schema:
        type: string
        format: uuid
    IntIdPath:
      name: id
      in: path
      required: true
      description: Resource integer id. Invalid → 400.
      schema:
        type: integer
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Items per page. Server clamps to a maximum of 100.
      schema:
        type: integer
        minimum: 1
        default: 20
    SortOrderParam:
      name: sortOrder
      in: query
      required: false
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    SearchParam:
      name: search
      in: query
      required: false
      description: |
        Global search term. Trimmed; empty or < 2 chars is ignored (not an error).
      schema:
        type: string
        maxLength: 100
    PostSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `slug`, `status`, `visibility`, `publishedAt`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, slug, status, visibility, publishedAt, createdAt, updatedAt]
        default: createdAt
    EventSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `slug`, `status`, `visibility`, `publishedAt`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, slug, status, visibility, publishedAt, createdAt, updatedAt]
        default: createdAt
    CategorySortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `type`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, type, createdAt, updatedAt]
        default: createdAt
    EventTypeSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, createdAt, updatedAt]
        default: createdAt
    PostFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `status` (ContentStatus),
        `publishedAt`, `createdAt`, `updatedAt` (ISO 8601; date operators
        supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    EventFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `status` (ContentStatus),
        `publishedAt`, `createdAt`, `updatedAt` (ISO 8601; date operators
        supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    CategoryFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `type` (CategoryType), `name`,
        `createdAt`, `updatedAt` (ISO 8601; date operators supported).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    EventTypeFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `name`, `createdAt`, `updatedAt`
        (ISO 8601; date operators supported). Unknown keys / invalid enum /
        invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    ArchiveSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `type`, `status`, `publishedAt`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, type, status, publishedAt, createdAt, updatedAt]
        default: createdAt
    ArchiveFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `type` (ArchiveType), `status`
        (ArchiveStatus), `publishedAt`, `createdAt`, `updatedAt` (ISO 8601; date
        operators supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    NetworkSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `state`, `country`, `address`, `website`, `contact`, `status`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, state, country, address, website, contact, status, createdAt, updatedAt]
        default: createdAt
    NetworkFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `name`, `state`, `country`,
        `website`, `contact`, `status` (NetworkStatus), `source` (ContentSource),
        `createdAt`, `updatedAt` (ISO 8601; date operators
        supported, e.g.
        `filter[createdAt][gte]=2026-09-01T00:00:00Z`). Unknown keys / invalid
        enum / invalid date → 422. Empty values ignored. (`createdAt`/`updatedAt`
        are the date fields; `like` is rejected for date fields.)
      schema:
        type: object
        additionalProperties: true
    CountrySortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `iso2`, `iso3`, `regionName`, `population`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, iso2, iso3, regionName, population, createdAt, updatedAt]
        default: createdAt
    CountryFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `name`, `iso2`, `iso3`, `regionId`
        (32-bit integer; `like` rejected), `createdAt`, `updatedAt` (ISO 8601;
        date operators supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid value → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    StateSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `countryCode`, `type`, `level`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, countryCode, type, level, createdAt, updatedAt]
        default: createdAt
    StateFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `countryId` (32-bit integer),
        `countryCode` (exact match, case-sensitive ISO-2), `type`, `level`
        (32-bit integer), `createdAt`, `updatedAt` (ISO 8601; date operators
        supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid value → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    CitySortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, createdAt, updatedAt]
        default: createdAt
    CityFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `countryId` (32-bit integer),
        `stateId` (32-bit integer), `createdAt`, `updatedAt` (ISO 8601; date
        operators supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid value → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    SubscriptionSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `slug`, `subscriptionType`, `status`, `currency`, `price`, `durationInDays`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, slug, subscriptionType, status, currency, price, durationInDays, createdAt, updatedAt]
        default: createdAt
    SubscriptionFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `name`, `slug`, `currency`,
        `subscriptionType` (`SubscriptionType`), `status` (`SubscriptionStatus`),
        `durationInDays` (32-bit integer), `createdAt`, `updatedAt` (ISO 8601;
        date operators supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        `price` is **not** filterable (sortable only). Unknown keys / invalid
        enum / invalid value → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true

  responses:
    BadRequest:
      description: Malformed request — e.g. path `id` is not a valid UUID (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            message: Validation failed (uuid is expected)
            errors: []
    Unauthorized:
      description: Missing or invalid API key (401).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: Unauthorized
            errors: []
    Forbidden:
      description: Insufficient permission or row outside the caller's access scope (403).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            message: Forbidden resource
            errors: []
    NotFound:
      description: Resource not found (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Not Found
            errors: []
    Conflict:
      description: |
        Slug conflict (P2002) or invalid status transition
        (`Cannot <action> <resource> in status <STATUS>`) (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 409
            message: Cannot publish post in status DRAFT
            errors: []
    ValidationFailed:
      description: |
        Request validation failed (422). `errors` is populated with `{ field, message }`
        entries for DTO/body validation. For service-level validation raised as a bare
        string (e.g. unknown `sortBy`, unknown `filter` key, invalid enum/date in list
        params), `errors` is empty and `message` is always `Validation failed`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            statusCode: 422
            message: Validation failed
            errors:
              - field: name
                message: name should not be empty
    InternalServerError:
      description: Unexpected server error (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 500
            message: Internal server error
            errors: []
    TooManyRequests:
      description: Rate limit exceeded (429). Applies to public endpoints throttled per IP.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 429
            message: 'ThrottlerException: Too Many Requests'
            errors: []

  schemas:
    # ---------- primitives ----------
    ContentStatus:
      type: string
      enum: [DRAFT, REQUEST, APPROVED, PUBLISHED]
    ContentVisibility:
      type: string
      enum: [PUBLIC, PRIVATE]
    EventEntry:
      type: string
      enum: [FREE, TICKET, RESERVATION]
      description: |
        Entry mode. `RESERVATION` is a reserved target value — not yet emitted
        by the backend (current data only sends `FREE` / `TICKET`).
    ContentSource:
      type: string
      enum: [PUBLIC, REGISTERED]
    CategoryType:
      type: string
      enum: [STORY, ARCHIVE]
    ArchiveType:
      type: string
      enum: [MEMBER, PUBLIC]
    ArchiveStatus:
      type: string
      enum: [DRAFT, REQUEST, APPROVED, PUBLISHED]
    ArchiveMaterialType:
      type: string
      enum: [TUTORIALS, DOCUMENTARIES, RESEARCH, DOCUMENTS, HISTORY]
    # ---------- envelopes ----------
    SuccessMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: success
    PaginationMeta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [statusCode, message, errors]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        errors:
          type: array
          items: {}
    ValidationErrorResponse:
      type: object
      required: [statusCode, message, errors]
      properties:
        statusCode:
          type: integer
          const: 422
        message:
          type: string
          const: Validation failed
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    # ---------- shared refs ----------
    CategoryRef:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/CategoryType'
    CreatorRef:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
    CountryRef:
      type: object
      required: [id, iso2, name]
      properties:
        id:
          type: integer
        iso2:
          type: string
        name:
          type: string
    StateRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    CityRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    AuthorRef:
      type: object
      required: [id, fullName, avatar, countryId, country, stateId, state]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        avatar:
          type: [string, 'null']
          description: Ready-to-use profile photo URL; `null` when unset.
        countryId:
          type: [string, 'null']
          description: ISO-2 code (scalar FK `country_id`); `null` when unset.
        country:
          anyOf:
            - $ref: '#/components/schemas/CountryRef'
            - type: 'null'
        stateId:
          type: [integer, 'null']
        state:
          anyOf:
            - $ref: '#/components/schemas/StateRef'
            - type: 'null'
    NetworkRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    EventCreatorRef:
      type: object
      required: [id, fullName, network]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        network:
          anyOf:
            - $ref: '#/components/schemas/NetworkRef'
            - type: 'null'
    EventTypeRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    # ---------- images ----------
    ImageVariant:
      type: object
      required: [name, url, key, width, height, size, mimeType]
      properties:
        name:
          type: string
          enum: [large, medium, thumbnail]
        url:
          type: string
          format: uri
        key:
          type: string
        width:
          type: integer
        height:
          type: integer
        size:
          type: integer
        mimeType:
          type: string
    ImageResponse:
      type: object
      required: [id, url, key, filename, mimeType, size, width, height, variants]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        key:
          type: string
        filename:
          type: string
        mimeType:
          type: [string, 'null']
        size:
          type: [integer, 'null']
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ImageVariant'
    ImageUploadResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ImageResponse'
    ImageUploadListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ImageResponse'

    # ---------- posts ----------
    Post:
      type: object
      required:
        - id
        - name
        - slug
        - status
        - publishedAt
        - approvedAt
        - content
        - thumbnail
        - visibility
        - createdBy
        - creator
        - categories
        - authors
        - gallery
        - flyer
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [string, 'null']
          format: date-time
        approvedAt:
          type: [string, 'null']
          format: date-time
        content:
          type: string
        thumbnail:
          type: [string, 'null']
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        createdBy:
          type: [string, 'null']
          format: uuid
        creator:
          anyOf:
            - $ref: '#/components/schemas/CreatorRef'
            - type: 'null'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorRef'
        gallery:
          type: array
          items:
            $ref: '#/components/schemas/ImageResponse'
        flyer:
          type: array
          description: Ordered typed flyer groups; each group resolves its own images.
          items:
            $ref: '#/components/schemas/PostFlyerGroup'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PostResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Post'
    PostListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Post'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreatePostRequest:
      type: object
      additionalProperties: false
      description: |
        Optional fields are validated with `@IsOptional()`: omit them rather than
        sending `null`. Only `thumbnail` in the update DTO defines explicit `null`
        semantics (clear).
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        content:
          type: string
        thumbnail:
          type: string
          maxLength: 2048
        status:
          $ref: '#/components/schemas/ContentStatus'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        publishedAt:
          type: string
          format: date-time
          description: When sent, forces `status=PUBLISHED`.
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        authorIds:
          type: array
          maxItems: 100
          description: Ordered author user ids; replaces the whole array on update.
          items:
            type: string
            format: uuid
        imageIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        galleryImageIds:
          type: array
          maxItems: 100
          description: Ordered gallery image ids; replaces the whole array on update.
          items:
            type: string
            format: uuid
        flyerItems:
          type: array
          maxItems: 20
          description: Ordered typed flyer groups; replaces all groups on update.
          items:
            $ref: '#/components/schemas/FlyerItemRequest'
    UpdatePostRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; omit a field to leave it untouched. Only `thumbnail`
        defines explicit `null` (clear) semantics.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
