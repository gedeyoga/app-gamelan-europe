openapi: 3.1.0
info:
  title: Gamelan Europe — Story & Event API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Static OpenAPI 3.1.0 contract for the Story (`post`), Category, Event,
    EventType, Organization and Image endpoints of the NestJS backend.

    All endpoints require the `x-api-key` header (global `JwtAuthGuard`) and are
    further gated by RBAC permissions attached to the key. JWT login is internal
    and out of scope for this spec.

    ## Response envelope
    - Success (single): `{ data: <T>, message: "success" }`
    - Success (list):   `{ data: [<T>], meta: { page, limit, total }, message: "success" }`
    - Error:            `{ statusCode, message, errors: [] }`
    - Validation (422): `{ statusCode: 422, message: "Validation failed", errors: [{ field, message }] }`

    Global prefix: `/api/v1`. Global `ValidationPipe` uses `whitelist` +
    `forbidNonWhitelisted` + `transform`, so unknown body/query fields → 422.
servers:
  - url: https://api.europeangamelansociety.com/api/v1
    description: Production
tags:
  - name: Story
    description: Posts (backend resource `post`, UI label Story) + status transitions.
  - name: Categories
    description: Story/archive categories. Create is idempotent by `name` + `type`.
  - name: Events
    description: Events + status transitions.
  - name: EventTypes
    description: Event type taxonomy. Create is idempotent by `name`. No detail endpoint.
  - name: Organizations
    description: Organizations (admin-only). Used as the row-level scoping boundary for organization users. No row-level scoping in this module.
  - name: Images
    description: S3 image upload (multipart).
  - name: Archives
    description: |
      Archives + status transitions. `GET /archives` is the backend resource for
      the UI "Archives" menu.
  - name: Documents
    description: PDF document upload (multipart); bound to archives via `documentIds`.
security:
  - apiKeyAuth: []
paths:
  /posts:
    get:
      tags: [Story]
      operationId: listPosts
      summary: List posts (paginated)
      description: |
        Permission `story:read`. Row-level scoping applied server-side
        (`all` / `organization` / `published` / `none`).

        Member-only (`visibility=PRIVATE`) rows are never returned to callers lacking
        member access — the list filters them out.

        Filter by status with `filter[status]` (e.g. `filter[status]=PUBLISHED`);
        see the `filter` parameter for the full set of allowed keys.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/PostSortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PostFilterParam'
      responses:
        '200':
          description: Paginated list of posts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Story]
      operationId: createPost
      summary: Create post
      description: |
        Permission `story:create`. `slug` optional (auto-generated from `name`
        when omitted). Non-admin scopes cannot force `status`/`publishedAt`
        (forced to `DRAFT`). Sending `publishedAt` forces `status=PUBLISHED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}:
    get:
      tags: [Story]
      operationId: getPost
      summary: Get post by id
      description: |
        Permission `story:read`. Member-only (`visibility=PRIVATE`) rows are never
        returned to callers lacking member access — detail returns 403.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Post detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Story]
      operationId: updatePost
      summary: Update post
      description: |
        Permission `story:update`. Sending `slug` explicitly that collides → 409.
        `thumbnail: null` clears the thumbnail. `publishedAt` overrides `status`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Post updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Story]
      operationId: deletePost
      summary: Delete post
      description: Permission `story:delete`. Deletes bound image metadata + S3 objects (best effort).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted post (resolved gallery/flyer included).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/submit:
    post:
      tags: [Story]
      operationId: submitPost
      summary: Submit post for review (DRAFT → REQUEST)
      description: Permission `story:submit`. Invalid current status → 409.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/approve:
    post:
      tags: [Story]
      operationId: approvePost
      summary: Approve & publish post (REQUEST → PUBLISHED)
      description: Permission `story:approve`. Optional JSON body `{ publishedAt? }` (ISO8601). Invalid current status → 409; invalid body → 422.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishContentRequest'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/reject:
    post:
      tags: [Story]
      operationId: rejectPost
      summary: Reject post (REQUEST → DRAFT)
      description: Permission `story:reject`. Invalid current status → 409.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/publish:
    post:
      tags: [Story]
