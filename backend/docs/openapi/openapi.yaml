      responses:
        '200':
          description: State detail (with resolved `country`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Required. Raw API key in the `x-api-key` header, format `gke_<base64url>`
        (e.g. `gke_AbCdEf1234567890abcdefghijklmnopqrstuvwx`). Created via the API
        Key menu; RBAC permissions attach to the key.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Resource UUID (any version). Invalid UUID → 400.
      schema:
        type: string
        format: uuid
    IntIdPath:
      name: id
      in: path
      required: true
      description: Resource integer id. Invalid → 400.
      schema:
        type: integer
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Items per page. Server clamps to a maximum of 100.
      schema:
        type: integer
        minimum: 1
        default: 20
    SortOrderParam:
      name: sortOrder
      in: query
      required: false
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    SearchParam:
      name: search
      in: query
      required: false
      description: |
        Global search term. Trimmed; empty or < 2 chars is ignored (not an error).
      schema:
        type: string
        maxLength: 100
    PostSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `slug`, `status`, `visibility`, `publishedAt`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, slug, status, visibility, publishedAt, createdAt, updatedAt]
        default: createdAt
    EventSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `slug`, `status`, `visibility`, `publishedAt`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, slug, status, visibility, publishedAt, createdAt, updatedAt]
        default: createdAt
    CategorySortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `type`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, type, createdAt, updatedAt]
        default: createdAt
    EventTypeSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, createdAt, updatedAt]
        default: createdAt
    PostFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `status` (ContentStatus),
        `publishedAt`, `createdAt`, `updatedAt` (ISO 8601; date operators
        supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    EventFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `status` (ContentStatus),
        `publishedAt`, `createdAt`, `updatedAt` (ISO 8601; date operators
        supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    CategoryFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `type` (CategoryType), `name`,
        `createdAt`, `updatedAt` (ISO 8601; date operators supported).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    EventTypeFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `name`, `createdAt`, `updatedAt`
        (ISO 8601; date operators supported). Unknown keys / invalid enum /
        invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    EventSubmissionSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `title`, `status`, `startDate`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [title, status, startDate, createdAt, updatedAt]
        default: createdAt
    EventSubmissionFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `status` (`EventSubmissionStatus`),
        `countryId`, `eventTypeId`, `createdAt`, `updatedAt` (ISO 8601; date
        operators supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    ArchiveSubmissionSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `status`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, status, createdAt, updatedAt]
        default: createdAt
    ArchiveSubmissionFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `status` (`ArchiveSubmissionStatus`),
        `reviewedAt`, `createdAt`, `updatedAt` (ISO 8601; date operators
        supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    StorySubmissionSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `status`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, status, createdAt, updatedAt]
        default: createdAt
    StorySubmissionFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `status` (`StorySubmissionStatus`),
        `reviewedAt`, `createdAt`, `updatedAt` (ISO 8601; date operators
        supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    ArchiveSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `type`, `status`, `publishedAt`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, type, status, publishedAt, createdAt, updatedAt]
        default: createdAt
    ArchiveFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `type` (ArchiveType), `status`
        (ArchiveStatus), `publishedAt`, `createdAt`, `updatedAt` (ISO 8601; date
        operators supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    OrganizationSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `state`, `country`, `address`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, state, country, address, createdAt, updatedAt]
        default: createdAt
    OrganizationFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `name`, `state`, `country`,
        `createdAt`, `updatedAt` (ISO 8601; date operators supported, e.g.
        `filter[createdAt][gte]=2026-09-01T00:00:00Z`). Unknown keys / invalid
        enum / invalid date → 422. Empty values ignored. (`createdAt`/`updatedAt`
        are the date fields; `like` is rejected for date fields.)
      schema:
        type: object
        additionalProperties: true
    CountrySortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `iso2`, `iso3`, `regionName`, `population`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, iso2, iso3, regionName, population, createdAt, updatedAt]
        default: createdAt
    CountryFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `name`, `iso2`, `iso3`, `regionId`
        (32-bit integer; `like` rejected), `createdAt`, `updatedAt` (ISO 8601;
        date operators supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid value → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    StateSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `countryCode`, `type`, `level`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, countryCode, type, level, createdAt, updatedAt]
        default: createdAt
    StateFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `countryId` (32-bit integer),
        `countryCode` (exact match, case-sensitive ISO-2), `type`, `level`
        (32-bit integer), `createdAt`, `updatedAt` (ISO 8601; date operators
        supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid value → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true

  responses:
    BadRequest:
      description: Malformed request — e.g. path `id` is not a valid UUID (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            message: Validation failed (uuid is expected)
            errors: []
    Unauthorized:
      description: Missing or invalid API key (401).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: Unauthorized
            errors: []
    Forbidden:
      description: Insufficient permission or row outside the caller's access scope (403).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            message: Forbidden resource
            errors: []
    NotFound:
      description: Resource not found (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Not Found
            errors: []
    Conflict:
      description: |
        Slug conflict (P2002) or invalid status transition
        (`Cannot <action> <resource> in status <STATUS>`) (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 409
            message: Cannot publish post in status DRAFT
            errors: []
    ValidationFailed:
      description: |
        Request validation failed (422). `errors` is populated with `{ field, message }`
        entries for DTO/body validation. For service-level validation raised as a bare
        string (e.g. unknown `sortBy`, unknown `filter` key, invalid enum/date in list
        params), `errors` is empty and `message` is always `Validation failed`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            statusCode: 422
            message: Validation failed
            errors:
              - field: name
                message: name should not be empty
    InternalServerError:
      description: Unexpected server error (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 500
            message: Internal server error
            errors: []
    TooManyRequests:
      description: Rate limit exceeded (429). Applies to public endpoints throttled per IP.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 429
            message: 'ThrottlerException: Too Many Requests'
            errors: []

  schemas:
    # ---------- primitives ----------
    ContentStatus:
      type: string
      enum: [DRAFT, REQUEST, APPROVED, PUBLISHED]
    ContentVisibility:
      type: string
      enum: [PUBLIC, PRIVATE]
    CategoryType:
      type: string
      enum: [STORY, ARCHIVE]
    ArchiveType:
      type: string
      enum: [MEMBER, PUBLIC]
    ArchiveStatus:
      type: string
      enum: [DRAFT, REQUEST, APPROVED, PUBLISHED]
    EventSubmissionStatus:
      type: string
      enum: [REQUEST, APPROVED, REJECTED]

    # ---------- envelopes ----------
    SuccessMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: success
    PaginationMeta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [statusCode, message, errors]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        errors:
          type: array
          items: {}
    ValidationErrorResponse:
      type: object
      required: [statusCode, message, errors]
      properties:
        statusCode:
          type: integer
          const: 422
        message:
          type: string
          const: Validation failed
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    # ---------- shared refs ----------
    CategoryRef:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/CategoryType'
    CreatorRef:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
    OrganizationRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    EventCreatorRef:
      type: object
      required: [id, fullName, organization]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        organization:
          anyOf:
            - $ref: '#/components/schemas/OrganizationRef'
            - type: 'null'
    EventTypeRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    # ---------- images ----------
    ImageVariant:
      type: object
      required: [name, url, key, width, height, size, mimeType]
      properties:
        name:
          type: string
          enum: [large, medium, thumbnail]
        url:
          type: string
          format: uri
        key:
          type: string
        width:
          type: integer
        height:
          type: integer
        size:
          type: integer
        mimeType:
          type: string
    ImageResponse:
      type: object
      required: [id, url, key, filename, mimeType, size, width, height, variants]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        key:
          type: string
        filename:
          type: string
        mimeType:
          type: [string, 'null']
        size:
          type: [integer, 'null']
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ImageVariant'
    ImageUploadResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ImageResponse'

    # ---------- posts ----------
    Post:
      type: object
      required:
        - id
        - name
        - slug
        - status
        - publishedAt
        - approvedAt
        - content
        - thumbnail
        - visibility
        - createdBy
        - creator
        - categories
        - gallery
        - flyer
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [string, 'null']
          format: date-time
        approvedAt:
          type: [string, 'null']
          format: date-time
        content:
          type: string
        thumbnail:
          type: [string, 'null']
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        createdBy:
          type: [string, 'null']
          format: uuid
        creator:
          anyOf:
            - $ref: '#/components/schemas/CreatorRef'
            - type: 'null'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
        gallery:
          type: array
          items:
            $ref: '#/components/schemas/ImageResponse'
        flyer:
          type: array
          items:
            $ref: '#/components/schemas/ImageResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PostResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Post'
    PostListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Post'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreatePostRequest:
      type: object
      additionalProperties: false
      description: |
        Optional fields are validated with `@IsOptional()`: omit them rather than
        sending `null`. Only `thumbnail` in the update DTO defines explicit `null`
        semantics (clear).
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        content:
          type: string
        thumbnail:
          type: string
          maxLength: 2048
        status:
          $ref: '#/components/schemas/ContentStatus'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        publishedAt:
          type: string
          format: date-time
          description: When sent, forces `status=PUBLISHED`.
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        imageIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        galleryImageIds:
          type: array
          maxItems: 100
          description: Ordered gallery image ids; replaces the whole array on update.
          items:
            type: string
            format: uuid
        flyerImageIds:
          type: array
          maxItems: 100
          description: Ordered flyer image ids; replaces the whole array on update.
          items:
            type: string
            format: uuid
    UpdatePostRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; omit a field to leave it untouched. Only `thumbnail`
        defines explicit `null` (clear) semantics.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        content:
          type: string
        thumbnail:
          anyOf:
            - type: string
              maxLength: 2048
            - type: 'null'
          description: '`undefined` = leave untouched; `null` = clear thumbnail.'
        status:
          $ref: '#/components/schemas/ContentStatus'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        publishedAt:
          type: string
          format: date-time
          description: When sent, overrides `status` and sets `status=PUBLISHED`.
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        imageIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        galleryImageIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        flyerImageIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid

    # ---------- categories ----------
    Category:
      type: object
      required: [id, name, type, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/CategoryType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CategoryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Category'
    CategoryListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Category'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/CategoryType'
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/CategoryType'

    # ---------- event types ----------
    EventType:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventTypeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/EventType'
    EventTypeListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EventType'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreateEventTypeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    # ---------- organizations ----------
    Organization:
      type: object
      required: [id, name, state, country, address, lat, lng, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: [string, 'null']
        country:
          type: [string, 'null']
        address:
          type: [string, 'null']
        lat:
          type: [number, 'null']
        lng:
          type: [number, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Organization'
    OrganizationListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Organization'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 500
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; omit a field to leave it untouched. Sending `{}` returns the resource unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 500
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    # ---------- events ----------
    EventDate:
      type: object
      required: [date, startTime, endTime]
      properties:
        date:
          type: string
          format: date-time
          description: ISO 8601, UTC.
        startTime:
          type: [string, 'null']
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: '"HH:mm" 24-hour, or null.'
        endTime:
          type: [string, 'null']
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: '"HH:mm" 24-hour, or null.'
    EventLocation:
      type: object
      required: [name, address, lat, lng]
      properties:
        name:
          type: string
        address:
          type: [string, 'null']
        lat:
          type: [number, 'null']
        lng:
          type: [number, 'null']
    Event:
      type: object
      required:
        - id
        - name
        - slug
        - status
        - publishedAt
        - approvedAt
        - content
        - thumbnail
        - visibility
        - createdBy
        - creator
        - organizationId
        - organization
        - dates
        - eventTypes
        - location
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [string, 'null']
          format: date-time
        approvedAt:
          type: [string, 'null']
          format: date-time
        content:
          type: string
        thumbnail:
          type: [string, 'null']
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        createdBy:
          type: [string, 'null']
          format: uuid
        creator:
          anyOf:
            - $ref: '#/components/schemas/EventCreatorRef'
            - type: 'null'
        organizationId:
          type: [string, 'null']
          format: uuid
          description: Scalar FK (`organization_id`); `null` when unset.
        organization:
          anyOf:
            - $ref: '#/components/schemas/OrganizationRef'
            - type: 'null'
          description: Resolved organization (`Organization` row created on submission approve); `null` when unset.
        dates:
          type: array
          description: Ordered ascending by date.
          items:
            $ref: '#/components/schemas/EventDate'
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeRef'
        location:
          anyOf:
            - $ref: '#/components/schemas/EventLocation'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Event'
    EventListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Event'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    EventDateInput:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date:
          type: string
          format: date-time
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
    EventLocationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 500
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    CreateEventRequest:
      type: object
      additionalProperties: false
      description: |
        Optional fields are validated with `@IsOptional()`: omit them rather than
        sending `null`. Only `thumbnail` in the update DTO defines explicit `null`
        semantics (clear).
      required: [name, location]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        content:
          type: string
        thumbnail:
          type: string
          maxLength: 2048
        status:
          $ref: '#/components/schemas/ContentStatus'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        publishedAt:
          type: string
          format: date-time
          description: When sent, forces `status=PUBLISHED`.
        eventTypeIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        dates:
          type: array
          maxItems: 100
          description: Empty array (`[]`) is valid and clears all dates.
          items:
            $ref: '#/components/schemas/EventDateInput'
        location:
          $ref: '#/components/schemas/EventLocationInput'
    UpdateEventRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; omit a field to leave it untouched. Only `thumbnail`
        defines explicit `null` (clear) semantics.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        content:
          type: string
        thumbnail:
          anyOf:
            - type: string
              maxLength: 2048
            - type: 'null'
          description: '`undefined` = leave untouched; `null` = clear thumbnail.'
        status:
          $ref: '#/components/schemas/ContentStatus'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        publishedAt:
          type: string
          format: date-time
        eventTypeIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        dates:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EventDateInput'
        location:
          $ref: '#/components/schemas/EventLocationInput'

    # ---------- event submissions ----------
    CreateEventSubmissionRequest:
      type: object
      additionalProperties: false
      description: |
        Public submission payload (anonymous). Validated by the global
        `ValidationPipe` (`whitelist` + `forbidNonWhitelisted` + `transform`):
        unknown fields (e.g. `status`, `reviewedBy`, `eventId`) → 422.

        Cross-field / server rules, all surfaced as 422 with
        `errors: [{ field, message }]`:
        - `endDate` must be >= `startDate`; the inclusive range must not exceed 31 days.
        - `countryId` must exist.
        - `stateId`, when sent, must belong to `countryId`.
        - `eventTypeId` must exist.
        - `thumbnail`, when sent, must be an EGS storage URL (prefix
          `S3_PUBLIC_BASE_URL`) referencing an uploaded, still-unbound image with
          `entityType=event-submission` (from `POST /event-submissions/thumbnail`).
      required: [title, startDate, endDate, countryId, organiser, eventTypeId, shortDescription]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        startDate:
          type: string
          format: date
          description: Calendar date `YYYY-MM-DD` (stored as UTC midnight).
        endDate:
          type: string
          format: date
          description: Calendar date `YYYY-MM-DD`; >= `startDate`, max 31 inclusive days after it.
        countryId:
          type: integer
          description: Existing `Country.id`.
        stateId:
          type: integer
          description: Optional; must belong to `countryId`.
        organiser:
          type: string
          minLength: 1
          maxLength: 200
        eventTypeId:
          type: string
          format: uuid
        shortDescription:
          type: string
          minLength: 1
          maxLength: 500
        thumbnail:
          type: string
          format: uri
          maxLength: 2048
          description: Optional EGS storage image URL from `POST /event-submissions/thumbnail`.
    ReviewEventSubmissionRequest:
      type: object
      additionalProperties: false
      description: Optional body for `approve` / `reject`.
      properties:
        adminNote:
          type: string
          maxLength: 1000
    EventSubmission:
      type: object
      required:
        - id
        - title
        - startDate
        - endDate
        - countryId
        - country
        - stateId
        - state
        - organiser
        - eventTypeId
        - eventType
        - shortDescription
        - thumbnail
        - status
        - adminNote
        - reviewedBy
        - reviewedAt
        - eventId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        countryId:
          type: integer
        country:
          anyOf:
            - type: object
              required: [id, iso2, name]
              properties:
                id:
                  type: integer
                iso2:
                  type: string
                name:
                  type: string
            - type: 'null'
        stateId:
          type: [integer, 'null']
        state:
          anyOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: 'null'
        organiser:
          type: string
        eventTypeId:
          type: [string, 'null']
          format: uuid
        eventType:
          anyOf:
            - $ref: '#/components/schemas/EventTypeRef'
            - type: 'null'
        shortDescription:
          type: string
        thumbnail:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/EventSubmissionStatus'
        adminNote:
          type: [string, 'null']
        reviewedBy:
          type: [string, 'null']
          format: uuid
        reviewedAt:
          type: [string, 'null']
          format: date-time
        eventId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventSubmissionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/EventSubmission'
    EventSubmissionListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EventSubmission'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    EventSubmissionApproveResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [submission, event]
              properties:
                submission:
                  $ref: '#/components/schemas/EventSubmission'
                event:
                  type: object
                  required: [id, slug, status]
                  properties:
                    id:
                      type: string
                      format: uuid
                    slug:
                      type: string
                    status:
                      type: string
                      const: DRAFT

    # ---------- archive submissions ----------
    ArchiveSubmissionStatus:
      type: string
      enum: [REQUEST, APPROVED, REJECTED]
    ArchiveSubmission:
      type: object
      description: |
        Common archive-submission fields. Never echo a list's raw `attachmentIds`;
        the list view exposes `attachmentCount` and the detail view resolves
        `attachments` (see `ArchiveSubmissionListItem` / `ArchiveSubmissionResponse`).
      required:
        - id
        - name
        - description
        - thumbnail
        - externalLinks
        - status
        - adminNote
        - reviewedBy
        - reviewedAt
        - archiveId
        - archive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        thumbnail:
          type: [string, 'null']
        externalLinks:
          type: array
          items:
            type: string
            format: uri
        status:
          $ref: '#/components/schemas/ArchiveSubmissionStatus'
        adminNote:
          type: [string, 'null']
        reviewedBy:
          type: [string, 'null']
          format: uuid
        reviewedAt:
          type: [string, 'null']
          format: date-time
        archiveId:
          type: [string, 'null']
          format: uuid
        archive:
          anyOf:
            - type: object
              required: [id, status]
              properties:
                id:
                  type: string
                  format: uuid
                status:
                  $ref: '#/components/schemas/ArchiveStatus'
            - type: 'null'
          description: Recreated archive (`status=DRAFT` after approve); `null` until approved.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ArchiveSubmissionListItem:
      allOf:
        - $ref: '#/components/schemas/ArchiveSubmission'
        - type: object
          required: [attachmentCount]
          properties:
            attachmentCount:
              type: integer
              minimum: 0
    ArchiveSubmissionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/ArchiveSubmission'
                - type: object
                  required: [attachments]
                  properties:
                    attachments:
                      type: array
                      description: Bound documents resolved in stored order; raw `attachmentIds` are never returned.
                      items:
                        $ref: '#/components/schemas/Document'
    ArchiveSubmissionListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ArchiveSubmissionListItem'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    ArchiveSubmissionApproveResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [submission, archive]
              properties:
                submission:
                  $ref: '#/components/schemas/ArchiveSubmissionListItem'
                archive:
                  type: object
                  required: [id, status]
                  properties:
                    id:
                      type: string
                      format: uuid
                    status:
                      $ref: '#/components/schemas/ArchiveStatus'
                      description: Always `DRAFT` after approve (not published).
    CreateArchiveSubmissionRequest:
      type: object
      additionalProperties: false
      description: |
        Public submission payload (anonymous). Validated by the global
        `ValidationPipe` (`whitelist` + `forbidNonWhitelisted` + `transform`):
        unknown fields (e.g. `status`, `reviewedBy`, `archiveId`, `categoryIds`,
        `documentIds`) → 422.

        Cross-field / server rules, all surfaced as 422 with
        `errors: [{ field, message }]`:
        - `thumbnail`, when sent, must be an EGS storage URL (prefix
          `S3_PUBLIC_BASE_URL`) referencing an uploaded, still-unbound image with
          `entityType=archive-submission` (from `POST /archive-submissions/thumbnail`).
        - each `attachments.N` must reference an uploaded, still-unbound `Document`
          with `entityType=archive-submission` (from
          `POST /archive-submissions/attachments`).
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        thumbnail:
          type: string
          maxLength: 2048
          description: Optional EGS storage image URL from `POST /archive-submissions/thumbnail`.
        externalLinks:
          type: array
          maxItems: 50
          description: Ordered external links (order preserved).
          items:
            type: string
            format: uri
        attachments:
          type: array
          maxItems: 20
          description: Ordered `Document` ids from `POST /archive-submissions/attachments`.
          items:
            type: string
            format: uuid
    ReviewArchiveSubmissionRequest:
      type: object
      additionalProperties: false
      description: Optional body for `approve` / `reject`.
      properties:
        adminNote:
          type: string
          maxLength: 1000

    # ---------- story submissions ----------
    StorySubmissionStatus:
      type: string
      enum: [REQUEST, APPROVED, REJECTED]
    StorySubmission:
      type: object
      description: |
        Common story-submission fields. Raw `content`/`categoryIds`/image ids are
        never exposed on list items; the list view exposes resolved `categories`
        and counts, the detail view adds `content`/`categoryIds` and resolves
        `gallery`/`flyer` (see `StorySubmissionListItem` / `StorySubmissionResponse`).
      required:
        - id
        - name
        - thumbnail
        - status
        - adminNote
        - reviewedBy
        - reviewedAt
        - postId
        - post
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        thumbnail:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/StorySubmissionStatus'
        adminNote:
          type: [string, 'null']
        reviewedBy:
          type: [string, 'null']
          format: uuid
        reviewedAt:
          type: [string, 'null']
          format: date-time
        postId:
          type: [string, 'null']
          format: uuid
        post:
          anyOf:
            - type: object
              required: [id, slug, status]
              properties:
                id:
                  type: string
                  format: uuid
                slug:
                  type: string
                status:
                  $ref: '#/components/schemas/ContentStatus'
            - type: 'null'
          description: Recreated post (`status=DRAFT` after approve); `null` until approved.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StorySubmissionListItem:
      allOf:
        - $ref: '#/components/schemas/StorySubmission'
        - type: object
          required: [categories, galleryCount, flyerCount]
          properties:
            categories:
              type: array
              description: Resolved STORY categories (`{ id, name }`).
              items:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
            galleryCount:
              type: integer
              minimum: 0
            flyerCount:
              type: integer
              minimum: 0
    StorySubmissionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/StorySubmission'
                - type: object
                  required: [categories, galleryCount, flyerCount, content, categoryIds, gallery, flyer]
                  properties:
                    categories:
                      type: array
                      items:
                        type: object
                        required: [id, name]
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                    galleryCount:
                      type: integer
                      minimum: 0
                    flyerCount:
                      type: integer
                      minimum: 0
                    content:
                      type: string
                      description: Sanitized rich HTML (strict allowlist).
                    categoryIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                    gallery:
                      type: array
                      description: Resolved gallery images in stored order.
                      items:
                        $ref: '#/components/schemas/ImageResponse'
                    flyer:
                      type: array
                      description: Resolved flyer images in stored order.
                      items:
                        $ref: '#/components/schemas/ImageResponse'
    StorySubmissionListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/StorySubmissionListItem'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    StorySubmissionApproveResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [submission, story]
              properties:
                submission:
                  $ref: '#/components/schemas/StorySubmissionListItem'
                story:
                  type: object
                  required: [id, slug, status]
                  properties:
                    id:
                      type: string
                      format: uuid
                    slug:
                      type: string
                    status:
                      type: string
                      const: DRAFT
    StorySubmissionCategoryListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreateStorySubmissionRequest:
      type: object
      additionalProperties: false
      description: |
        Public submission payload (anonymous). `content` is rich HTML and is
        sanitized server-side (strict allowlist); a payload that becomes empty
        after sanitization → 422. Validated by the global `ValidationPipe`
        (`whitelist` + `forbidNonWhitelisted` + `transform`): unknown fields
        (e.g. `status`, `reviewedBy`, `postId`) → 422.

        Cross-field / server rules, all surfaced as 422 with
        `errors: [{ field, message }]`:
        - each `categoryIds.N` must exist and be a `STORY` category.
        - each `galleryImageIds.N` / `flyerImageIds.N` must reference an uploaded,
          still-unbound `Image` with `entityType=story-submission` (from
          `POST /story-submissions/images`).
        - `thumbnail`, when sent, must be an EGS storage URL referencing an
          uploaded, still-unbound image with `entityType=story-submission`.
      required: [name, content]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 100000
          description: Rich HTML; sanitized server-side before storage.
        categoryIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        galleryImageIds:
          type: array
          maxItems: 50
          description: Ordered `Image` ids from `POST /story-submissions/images`.
          items:
            type: string
            format: uuid
        flyerImageIds:
          type: array
          maxItems: 50
          description: Ordered `Image` ids from `POST /story-submissions/images`.
          items:
            type: string
            format: uuid
        thumbnail:
          type: string
          maxLength: 2048
          description: Optional EGS storage image URL from `POST /story-submissions/thumbnail`.
    ReviewStorySubmissionRequest:
      type: object
      additionalProperties: false
      description: Optional body for `approve` / `reject`.
      properties:
        adminNote:
          type: string
          maxLength: 1000

    # ---------- archives ----------
    PublishContentRequest:
      type: object
      additionalProperties: false
      description: Optional body for `approve` / `publish`.
      properties:
        publishedAt:
          type: string
          format: date-time
          description: Optional ISO 8601 publish date; defaults to the existing value or now.
    Document:
      type: object
      required: [id, url, key, filename, mimeType, size]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        key:
          type: string
        filename:
          type: string
        mimeType:
          type: [string, 'null']
        size:
          type: [integer, 'null']
    ArchiveCreatorRef:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
    ArchiveListItem:
      type: object
      description: |
        Archive list item. `externalLinks` is `null` when `type=MEMBER` and the
        caller lacks member access (`canViewPrivate=false`); otherwise it is the
        ordered list of URLs. `documents` is not present on list items.
      required:
        - id
        - name
        - description
        - thumbnail
        - type
        - status
        - publishedAt
        - approvedAt
        - externalLinks
        - categories
        - creator
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        thumbnail:
          type: [string, 'null']
        type:
          $ref: '#/components/schemas/ArchiveType'
        status:
          $ref: '#/components/schemas/ArchiveStatus'
        publishedAt:
          type: [string, 'null']
          format: date-time
        approvedAt:
          type: [string, 'null']
          format: date-time
        externalLinks:
          type: [array, 'null']
          maxItems: 50
          description: '`null` when `type=MEMBER` and the caller lacks member access (`canViewPrivate=false`).'
          items:
            type: string
            format: uri
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
        creator:
          anyOf:
            - $ref: '#/components/schemas/ArchiveCreatorRef'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Archive:
      allOf:
        - $ref: '#/components/schemas/ArchiveListItem'
        - type: object
          description: |
            Archive detail. `documents` is `null` when `type=MEMBER` and the caller
            lacks member access (`canViewPrivate=false`); otherwise it is the
            ordered list of bound documents. `externalLinks` follows the same rule.
          required: [documents]
          properties:
            documents:
              type: [array, 'null']
              items:
                $ref: '#/components/schemas/Document'
    ArchiveResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Archive'
    ArchiveListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ArchiveListItem'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreateArchiveRequest:
      type: object
      additionalProperties: false
      description: |
        Optional fields are validated with `@IsOptional()`: omit them rather than
        sending `null`. Only `thumbnail`/`publishedAt` in the update DTO define
        explicit `null` semantics.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        thumbnail:
          type: string
          maxLength: 2048
        type:
          $ref: '#/components/schemas/ArchiveType'
        status:
          $ref: '#/components/schemas/ArchiveStatus'
        publishedAt:
          type: string
          format: date-time
          description: When sent, forces `status=PUBLISHED`.
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        externalLinks:
          type: array
          maxItems: 50
          items:
            type: string
            format: uri
        documentIds:
          type: array
          maxItems: 50
          description: Ordered document ids; replaces the whole array on update.
          items:
            type: string
            format: uuid
    UpdateArchiveRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; omit a field to leave it untouched. `thumbnail: null`
        clears the thumbnail; `publishedAt: null` clears the publish date without
        forcing `status`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        thumbnail:
          anyOf:
            - type: string
              maxLength: 2048
            - type: 'null'
          description: '`undefined` = leave untouched; `null` = clear thumbnail.'
        type:
          $ref: '#/components/schemas/ArchiveType'
        status:
          $ref: '#/components/schemas/ArchiveStatus'
        publishedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: '`null` = clear the date without forcing `PUBLISHED`; a value overrides `status` and forces `PUBLISHED`.'
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        externalLinks:
          type: array
          maxItems: 50
          items:
            type: string
            format: uri
        documentIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid

    # ---------- upload ----------
    UploadImageRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: 'Allowed mime types: `image/png`, `image/jpeg`, `image/webp`. Max size `UPLOAD_MAX_SIZE_MB` (default 5 MB).'
        entityType:
          type: string
          enum: [post, event]
          default: post
    DocumentUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: 'PDF only (`application/pdf`, validated by magic bytes `%PDF-`). Max size `UPLOAD_DOCUMENT_MAX_SIZE_MB` (default 10 MB).'
        entityType:
          type: string
          enum: [archive]
          default: archive
    DocumentUploadResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Document'

    # ---------- countries ----------
    Country:
      type: object
      description: |
        Seeded geo reference row (source dr5hn, read-only). `population`/`gdp`
        are `BigInt` in the DB and serialized as `number | null`;
        `latitude`/`longitude` are Prisma `Decimal` serialized as strings.
      required:
        - id
        - name
        - iso2
        - iso3
        - numericCode
        - phoneCode
        - capital
        - currency
        - currencyName
        - currencySymbol
        - tld
        - native
        - population
        - gdp
        - regionName
        - subregion
        - nationality
        - timezones
        - translations
        - latitude
        - longitude
        - emoji
        - emojiU
        - wikiDataId
        - regionId
        - region
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        iso2:
          type: string
        iso3:
          type: [string, 'null']
        numericCode:
          type: [string, 'null']
        phoneCode:
          type: [string, 'null']
        capital:
          type: [string, 'null']
        currency:
          type: [string, 'null']
        currencyName:
          type: [string, 'null']
        currencySymbol:
          type: [string, 'null']
        tld:
          type: [string, 'null']
        native:
          type: [string, 'null']
        population:
          type: [number, 'null']
        gdp:
          type: [number, 'null']
        regionName:
          type: [string, 'null']
          description: Denormalized upstream region name.
        subregion:
          type: [string, 'null']
        nationality:
          type: [string, 'null']
        timezones:
          type: [array, 'null']
          items:
            type: string
        translations:
          type: [object, 'null']
          additionalProperties: true
        latitude:
          type: [string, 'null']
          description: Prisma `Decimal` serialized as a string.
        longitude:
          type: [string, 'null']
          description: Prisma `Decimal` serialized as a string.
        emoji:
          type: [string, 'null']
        emojiU:
          type: [string, 'null']
        wikiDataId:
          type: [string, 'null']
        regionId:
          type: [integer, 'null']
          description: Scalar FK (`region_id`); `null` when unset.
        region:
          anyOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: 'null'
          description: Resolved region; `null` when unset.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CountryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Country'
    CountryListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Country'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    # ---------- states ----------
    State:
      type: object
      description: |
        Seeded geo reference row (source dr5hn, read-only). List view — no
        `country` relation. `latitude`/`longitude` are Prisma `Decimal`
        serialized as strings.
      required:
        - id
        - name
        - countryCode
        - iso2
        - iso3166_2
        - type
        - level
        - native
        - latitude
        - longitude
        - timezone
        - wikiDataId
        - countryId
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        countryCode:
          type: string
          description: ISO-2 code (denormalized); exact match, case-sensitive.
        iso2:
          type: [string, 'null']
        iso3166_2:
          type: [string, 'null']
        type:
          type: [string, 'null']
        level:
          type: [integer, 'null']
        native:
          type: [string, 'null']
        latitude:
          type: [string, 'null']
          description: Prisma `Decimal` serialized as a string.
        longitude:
          type: [string, 'null']
          description: Prisma `Decimal` serialized as a string.
        timezone:
          type: [string, 'null']
        wikiDataId:
          type: [string, 'null']
        countryId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StateWithCountry:
      allOf:
        - $ref: '#/components/schemas/State'
        - type: object
          description: Detail view — additionally resolves the owning `country`.
          required: [country]
          properties:
            country:
              type: object
              required: [id, iso2, name]
              properties:
                id:
                  type: integer
                iso2:
                  type: string
                name:
                  type: string
    StateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/StateWithCountry'
    StateListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/State'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
