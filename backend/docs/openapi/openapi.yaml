        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Archives]
      operationId: createArchive
      summary: Create archive
      description: |
        Permission `archive:create`. Non-admin scopes cannot force
        `status`/`publishedAt` (forced to `DRAFT`). Sending `publishedAt` forces
        `status=PUBLISHED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArchiveRequest'
      responses:
        '201':
          description: Archive created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
