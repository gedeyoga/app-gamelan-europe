openapi: 3.1.0
info:
  title: Gamelan Europe — Story & Event API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Static OpenAPI 3.1.0 contract for the Story (`post`), Category, Event,
    EventType, Organization, EventSubmission, Archive, Document and Image
    endpoints of the NestJS backend.

    All endpoints require the `x-api-key` header (global `JwtAuthGuard`) and are
    further gated by RBAC permissions attached to the key. JWT login is internal
    and out of scope for this spec.

    **Public endpoints** are exempt from `x-api-key` (`@Public()`) and override the
    global `security` with `security: []`: `POST /event-submissions`,
    `POST /event-submissions/thumbnail`, `POST /archive-submissions`,
    `POST /archive-submissions/thumbnail`, `POST /archive-submissions/attachments`,
    `POST /story-submissions`, `POST /story-submissions/thumbnail`,
    `POST /story-submissions/images`, `GET /story-submissions/categories`,
    `GET /event-types`, `GET /countries`, `GET /countries/{id}`, `GET /states`,
    `GET /states/{id}`. The submission write/upload endpoints (event, archive and
    story submissions) are rate-limited per IP (`429` on excess).

    `story-submission` `content` is sanitized server-side with a strict allowlist
    before it is stored, and the global JSON body limit is `1mb` (larger JSON
    receives `413`; multipart uploads are unaffected).

    ## Response envelope
    - Success (single): `{ data: <T>, message: "success" }`
    - Success (list):   `{ data: [<T>], meta: { page, limit, total }, message: "success" }`
    - Error:            `{ statusCode, message, errors: [] }`
    - Validation (422): `{ statusCode: 422, message: "Validation failed", errors: [{ field, message }] }`

    Global prefix: `/api/v1`. Global `ValidationPipe` uses `whitelist` +
    `forbidNonWhitelisted` + `transform`, so unknown body/query fields → 422.
servers:
  - url: https://api.europeangamelansociety.com/api/v1
    description: Production
tags:
  - name: Story
    description: Posts (backend resource `post`, UI label Story) + status transitions.
  - name: Categories
    description: Story/archive categories. Create is idempotent by `name` + `type`.
  - name: Events
    description: Events + status transitions.
  - name: EventTypes
    description: Event type taxonomy. `GET` is public (dropdown for the submission form). Create is idempotent by `name`. No detail endpoint.
  - name: EventSubmissions
    description: |
      Event proposals submitted by the public (no account). Admins review the
      queue; approve recreates an `Event` with `status=DRAFT` (not published).
  - name: ArchiveSubmissions
    description: |
      Archive proposals submitted by the public (no account). Admins review the
      queue; approve recreates an `Archive` with `status=DRAFT` (not published).
  - name: StorySubmissions
    description: |
      Story proposals submitted by the public (no account), including rich
      `content` (sanitized server-side). Admins review the queue; approve
      recreates a `Post` with `status=DRAFT` (not published).
  - name: Organizations
    description: Organizations (admin-only). Used as the row-level scoping boundary for organization users. No row-level scoping in this module.
  - name: Images
    description: S3 image upload (multipart).
  - name: Archives
    description: |
      Archives + status transitions. `GET /archives` is the backend resource for
      the UI "Archives" menu.
  - name: Documents
    description: PDF document upload (multipart); bound to archives via `documentIds`.
  - name: Countries
    description: |
      Public geo reference data (read-only, source dr5hn/countries-states-cities-database).
      No create/update/delete; served from the seeded `Country` table.
  - name: States
    description: |
      Public geo reference data (read-only, source dr5hn/countries-states-cities-database).
      No create/update/delete; served from the seeded `State` table.
security:
  - apiKeyAuth: []
paths:
  /posts:
    get:
      tags: [Story]
      operationId: listPosts
      summary: List posts (paginated)
      description: |
        Permission `story:read`. Row-level scoping applied server-side
        (`all` / `organization` / `published` / `none`).

        Member-only (`visibility=PRIVATE`) rows are never returned to callers lacking
        member access — the list filters them out.

        Filter by status with `filter[status]` (e.g. `filter[status]=PUBLISHED`);
        see the `filter` parameter for the full set of allowed keys.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/PostSortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PostFilterParam'
      responses:
        '200':
          description: Paginated list of posts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Story]
      operationId: createPost
      summary: Create post
      description: |
        Permission `story:create`. `slug` optional (auto-generated from `name`
        when omitted). Non-admin scopes cannot force `status`/`publishedAt`
        (forced to `DRAFT`). Sending `publishedAt` forces `status=PUBLISHED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}:
    get:
      tags: [Story]
      operationId: getPost
      summary: Get post by id
      description: |
        Permission `story:read`. Member-only (`visibility=PRIVATE`) rows are never
        returned to callers lacking member access — detail returns 403.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Post detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Story]
      operationId: updatePost
      summary: Update post
      description: |
        Permission `story:update`. Sending `slug` explicitly that collides → 409.
        `thumbnail: null` clears the thumbnail. `publishedAt` overrides `status`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Post updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Story]
      operationId: deletePost
      summary: Delete post
      description: Permission `story:delete`. Deletes bound image metadata + S3 objects (best effort).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted post (resolved gallery/flyer included).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/submit:
    post:
      tags: [Story]
      operationId: submitPost
      summary: Submit post for review (DRAFT → REQUEST)
      description: Permission `story:submit`. Invalid current status → 409.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/approve:
    post:
      tags: [Story]
      operationId: approvePost
      summary: Approve & publish post (REQUEST → PUBLISHED)
      description: Permission `story:approve`. Optional JSON body `{ publishedAt? }` (ISO8601). Invalid current status → 409; invalid body → 422.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishContentRequest'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/reject:
    post:
      tags: [Story]
      operationId: rejectPost
      summary: Reject post (REQUEST → DRAFT)
      description: Permission `story:reject`. Invalid current status → 409.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/publish:
    post:
      tags: [Story]
      operationId: publishPost
      summary: Publish post (APPROVED → PUBLISHED)
      description: Permission `story:publish`. Optional JSON body `{ publishedAt? }` (ISO8601). Invalid current status → 409; invalid body → 422.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishContentRequest'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/unpublish:
    post:
      tags: [Story]
      operationId: unpublishPost
      summary: Unpublish post (PUBLISHED → DRAFT)
      description: Permission `story:unpublish`. Invalid current status → 409.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Post transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories (paginated)
      description: Permission `category:read`.
      parameters:
