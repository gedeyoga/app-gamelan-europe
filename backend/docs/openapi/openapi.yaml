        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create event
      description: |
        Permission `event:create`. `slug` optional (auto-generated from `name`).
        `location` is required. Non-admin scopes cannot force
        `status`/`publishedAt` (forced to `DRAFT`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
