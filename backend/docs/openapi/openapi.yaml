    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create category (idempotent)
      description: |
        Permission `category:create`. Idempotent: same `name`
        (case-insensitive) + `type` returns the existing category (no 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created (or existing one returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories/{id}:
