components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Required. Raw API key in the `x-api-key` header, format `gke_<base64url>`
        (e.g. `gke_AbCdEf1234567890abcdefghijklmnopqrstuvwx`). Created via the API
        Key menu; RBAC permissions attach to the key.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Resource UUID (any version). Invalid UUID → 400.
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Items per page. Server clamps to a maximum of 100.
      schema:
        type: integer
        minimum: 1
        default: 20
    SortOrderParam:
      name: sortOrder
      in: query
      required: false
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    SearchParam:
      name: search
      in: query
      required: false
      description: |
        Global search term. Trimmed; empty or < 2 chars is ignored (not an error).
      schema:
        type: string
        maxLength: 100
    PostSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `slug`, `status`, `visibility`, `publishedAt`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, slug, status, visibility, publishedAt, createdAt, updatedAt]
        default: createdAt
    EventSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `slug`, `status`, `visibility`, `publishedAt`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, slug, status, visibility, publishedAt, createdAt, updatedAt]
        default: createdAt
    CategorySortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `type`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, type, createdAt, updatedAt]
        default: createdAt
    EventTypeSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, createdAt, updatedAt]
        default: createdAt
    PostFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `status` (ContentStatus),
        `publishedAt`, `createdAt`, `updatedAt` (ISO 8601; date operators
        supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    EventFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `status` (ContentStatus),
        `publishedAt`, `createdAt`, `updatedAt` (ISO 8601; date operators
        supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    CategoryFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `type` (CategoryType), `name`,
        `createdAt`, `updatedAt` (ISO 8601; date operators supported).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    EventTypeFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `name`, `createdAt`, `updatedAt`
        (ISO 8601; date operators supported). Unknown keys / invalid enum /
        invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    ArchiveSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `type`, `status`, `publishedAt`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, type, status, publishedAt, createdAt, updatedAt]
        default: createdAt
    ArchiveFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `type` (ArchiveType), `status`
        (ArchiveStatus), `publishedAt`, `createdAt`, `updatedAt` (ISO 8601; date
        operators supported, e.g. `filter[createdAt][gte]=2026-09-01T00:00:00Z`).
        Unknown keys / invalid enum / invalid date → 422. Empty values ignored.
      schema:
        type: object
        additionalProperties: true
    OrganizationSortByParam:
      name: sortBy
      in: query
      required: false
      description: 'Allowed: `name`, `state`, `country`, `address`, `createdAt`, `updatedAt`. Unknown → 422.'
      schema:
        type: string
        enum: [name, state, country, address, createdAt, updatedAt]
        default: createdAt
    OrganizationFilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Deep-object filter. Allowed keys: `name`, `state`, `country`,
        `createdAt`, `updatedAt` (ISO 8601; date operators supported, e.g.
        `filter[createdAt][gte]=2026-09-01T00:00:00Z`). Unknown keys / invalid
        enum / invalid date → 422. Empty values ignored. (`createdAt`/`updatedAt`
        are the date fields; `like` is rejected for date fields.)
      schema:
        type: object
        additionalProperties: true

  responses:
    BadRequest:
      description: Malformed request — e.g. path `id` is not a valid UUID (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            message: Validation failed (uuid is expected)
            errors: []
    Unauthorized:
      description: Missing or invalid API key (401).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: Unauthorized
            errors: []
    Forbidden:
      description: Insufficient permission or row outside the caller's access scope (403).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            message: Forbidden resource
            errors: []
    NotFound:
      description: Resource not found (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Not Found
            errors: []
    Conflict:
      description: |
        Slug conflict (P2002) or invalid status transition
        (`Cannot <action> <resource> in status <STATUS>`) (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 409
            message: Cannot publish post in status DRAFT
            errors: []
    ValidationFailed:
      description: |
        Request validation failed (422). `errors` is populated with `{ field, message }`
        entries for DTO/body validation. For service-level validation raised as a bare
        string (e.g. unknown `sortBy`, unknown `filter` key, invalid enum/date in list
        params), `errors` is empty and `message` is always `Validation failed`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            statusCode: 422
            message: Validation failed
            errors:
              - field: name
                message: name should not be empty
    InternalServerError:
      description: Unexpected server error (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 500
            message: Internal server error
            errors: []

  schemas:
    # ---------- primitives ----------
    ContentStatus:
      type: string
      enum: [DRAFT, REQUEST, APPROVED, PUBLISHED]
    ContentVisibility:
      type: string
      enum: [PUBLIC, PRIVATE]
    CategoryType:
      type: string
      enum: [STORY, ARCHIVE]
    ArchiveType:
      type: string
      enum: [MEMBER, PUBLIC]
    ArchiveStatus:
      type: string
      enum: [DRAFT, REQUEST, APPROVED, PUBLISHED]

    # ---------- envelopes ----------
    SuccessMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: success
    PaginationMeta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [statusCode, message, errors]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        errors:
          type: array
          items: {}
    ValidationErrorResponse:
      type: object
      required: [statusCode, message, errors]
      properties:
        statusCode:
          type: integer
          const: 422
        message:
          type: string
          const: Validation failed
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    # ---------- shared refs ----------
    CategoryRef:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/CategoryType'
    CreatorRef:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
    OrganizationRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    EventCreatorRef:
      type: object
      required: [id, fullName, organization]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        organization:
          anyOf:
            - $ref: '#/components/schemas/OrganizationRef'
            - type: 'null'
    EventTypeRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    # ---------- images ----------
    ImageVariant:
      type: object
      required: [name, url, key, width, height, size, mimeType]
      properties:
        name:
          type: string
          enum: [large, medium, thumbnail]
        url:
          type: string
          format: uri
        key:
          type: string
        width:
          type: integer
        height:
          type: integer
        size:
          type: integer
        mimeType:
          type: string
    ImageResponse:
      type: object
      required: [id, url, key, filename, mimeType, size, width, height, variants]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        key:
          type: string
        filename:
          type: string
        mimeType:
          type: [string, 'null']
        size:
          type: [integer, 'null']
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ImageVariant'
    ImageUploadResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ImageResponse'

    # ---------- posts ----------
    Post:
      type: object
      required:
        - id
        - name
        - slug
        - status
        - publishedAt
        - approvedAt
        - content
        - thumbnail
        - visibility
        - createdBy
        - creator
        - categories
        - gallery
        - flyer
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [string, 'null']
          format: date-time
        approvedAt:
          type: [string, 'null']
          format: date-time
        content:
          type: string
        thumbnail:
          type: [string, 'null']
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        createdBy:
          type: [string, 'null']
          format: uuid
        creator:
          anyOf:
            - $ref: '#/components/schemas/CreatorRef'
            - type: 'null'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
        gallery:
          type: array
          items:
            $ref: '#/components/schemas/ImageResponse'
        flyer:
          type: array
          items:
            $ref: '#/components/schemas/ImageResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PostResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Post'
    PostListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Post'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreatePostRequest:
      type: object
      additionalProperties: false
      description: |
        Optional fields are validated with `@IsOptional()`: omit them rather than
        sending `null`. Only `thumbnail` in the update DTO defines explicit `null`
        semantics (clear).
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        content:
          type: string
        thumbnail:
          type: string
          maxLength: 2048
        status:
          $ref: '#/components/schemas/ContentStatus'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        publishedAt:
          type: string
          format: date-time
          description: When sent, forces `status=PUBLISHED`.
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        imageIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        galleryImageIds:
          type: array
          maxItems: 100
          description: Ordered gallery image ids; replaces the whole array on update.
          items:
            type: string
            format: uuid
        flyerImageIds:
          type: array
          maxItems: 100
          description: Ordered flyer image ids; replaces the whole array on update.
          items:
            type: string
            format: uuid
    UpdatePostRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; omit a field to leave it untouched. Only `thumbnail`
        defines explicit `null` (clear) semantics.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        content:
          type: string
        thumbnail:
          anyOf:
            - type: string
              maxLength: 2048
            - type: 'null'
          description: '`undefined` = leave untouched; `null` = clear thumbnail.'
        status:
          $ref: '#/components/schemas/ContentStatus'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        publishedAt:
          type: string
          format: date-time
          description: When sent, overrides `status` and sets `status=PUBLISHED`.
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        imageIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        galleryImageIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        flyerImageIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid

    # ---------- categories ----------
    Category:
      type: object
      required: [id, name, type, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/CategoryType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CategoryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Category'
    CategoryListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Category'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/CategoryType'
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/CategoryType'

    # ---------- event types ----------
    EventType:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventTypeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/EventType'
    EventTypeListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EventType'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreateEventTypeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    # ---------- organizations ----------
    Organization:
      type: object
      required: [id, name, state, country, address, lat, lng, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: [string, 'null']
        country:
          type: [string, 'null']
        address:
          type: [string, 'null']
        lat:
          type: [number, 'null']
        lng:
          type: [number, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Organization'
    OrganizationListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Organization'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 500
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; omit a field to leave it untouched. Sending `{}` returns the resource unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 500
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    # ---------- events ----------
    EventDate:
      type: object
      required: [date, startTime, endTime]
      properties:
        date:
          type: string
          format: date-time
          description: ISO 8601, UTC.
        startTime:
          type: [string, 'null']
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: '"HH:mm" 24-hour, or null.'
        endTime:
          type: [string, 'null']
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: '"HH:mm" 24-hour, or null.'
    EventLocation:
      type: object
      required: [name, address, lat, lng]
      properties:
        name:
          type: string
        address:
          type: [string, 'null']
        lat:
          type: [number, 'null']
        lng:
          type: [number, 'null']
    Event:
      type: object
      required:
        - id
        - name
        - slug
        - status
        - publishedAt
        - approvedAt
        - content
        - thumbnail
        - visibility
        - createdBy
        - creator
        - dates
        - eventTypes
        - location
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [string, 'null']
          format: date-time
        approvedAt:
          type: [string, 'null']
          format: date-time
        content:
          type: string
        thumbnail:
          type: [string, 'null']
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        createdBy:
          type: [string, 'null']
          format: uuid
        creator:
          anyOf:
            - $ref: '#/components/schemas/EventCreatorRef'
            - type: 'null'
        dates:
          type: array
          description: Ordered ascending by date.
          items:
            $ref: '#/components/schemas/EventDate'
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeRef'
        location:
          anyOf:
            - $ref: '#/components/schemas/EventLocation'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Event'
    EventListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Event'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    EventDateInput:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date:
          type: string
          format: date-time
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
    EventLocationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 500
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    CreateEventRequest:
      type: object
      additionalProperties: false
      description: |
        Optional fields are validated with `@IsOptional()`: omit them rather than
        sending `null`. Only `thumbnail` in the update DTO defines explicit `null`
        semantics (clear).
      required: [name, location]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        content:
          type: string
        thumbnail:
          type: string
          maxLength: 2048
        status:
          $ref: '#/components/schemas/ContentStatus'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        publishedAt:
          type: string
          format: date-time
          description: When sent, forces `status=PUBLISHED`.
        eventTypeIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        dates:
          type: array
          maxItems: 100
          description: Empty array (`[]`) is valid and clears all dates.
          items:
            $ref: '#/components/schemas/EventDateInput'
        location:
          $ref: '#/components/schemas/EventLocationInput'
    UpdateEventRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; omit a field to leave it untouched. Only `thumbnail`
        defines explicit `null` (clear) semantics.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        content:
          type: string
        thumbnail:
          anyOf:
            - type: string
              maxLength: 2048
            - type: 'null'
          description: '`undefined` = leave untouched; `null` = clear thumbnail.'
        status:
          $ref: '#/components/schemas/ContentStatus'
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
        publishedAt:
          type: string
          format: date-time
        eventTypeIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        dates:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EventDateInput'
        location:
          $ref: '#/components/schemas/EventLocationInput'

    # ---------- archives ----------
    PublishContentRequest:
      type: object
      additionalProperties: false
      description: Optional body for `approve` / `publish`.
      properties:
        publishedAt:
          type: string
          format: date-time
          description: Optional ISO 8601 publish date; defaults to the existing value or now.
    Document:
      type: object
      required: [id, url, key, filename, mimeType, size]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        key:
          type: string
        filename:
          type: string
        mimeType:
          type: [string, 'null']
        size:
          type: [integer, 'null']
    ArchiveCreatorRef:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
    ArchiveListItem:
      type: object
      description: |
        Archive list item. `externalLinks` is `null` when `type=MEMBER` and the
        caller lacks member access (`canViewPrivate=false`); otherwise it is the
        ordered list of URLs. `documents` is not present on list items.
      required:
        - id
        - name
        - description
        - thumbnail
        - type
        - status
        - publishedAt
        - approvedAt
        - externalLinks
        - categories
        - creator
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        thumbnail:
          type: [string, 'null']
        type:
          $ref: '#/components/schemas/ArchiveType'
        status:
          $ref: '#/components/schemas/ArchiveStatus'
        publishedAt:
          type: [string, 'null']
          format: date-time
        approvedAt:
          type: [string, 'null']
          format: date-time
        externalLinks:
          type: [array, 'null']
          maxItems: 50
          description: '`null` when `type=MEMBER` and the caller lacks member access (`canViewPrivate=false`).'
          items:
            type: string
            format: uri
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
        creator:
          anyOf:
            - $ref: '#/components/schemas/ArchiveCreatorRef'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Archive:
      allOf:
        - $ref: '#/components/schemas/ArchiveListItem'
        - type: object
          description: |
            Archive detail. `documents` is `null` when `type=MEMBER` and the caller
            lacks member access (`canViewPrivate=false`); otherwise it is the
            ordered list of bound documents. `externalLinks` follows the same rule.
          required: [documents]
          properties:
            documents:
              type: [array, 'null']
              items:
                $ref: '#/components/schemas/Document'
    ArchiveResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Archive'
    ArchiveListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessMessage'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ArchiveListItem'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CreateArchiveRequest:
      type: object
      additionalProperties: false
      description: |
        Optional fields are validated with `@IsOptional()`: omit them rather than
        sending `null`. Only `thumbnail`/`publishedAt` in the update DTO define
        explicit `null` semantics.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        thumbnail:
          type: string
          maxLength: 2048
        type:
          $ref: '#/components/schemas/ArchiveType'
        status:
          $ref: '#/components/schemas/ArchiveStatus'
        publishedAt:
          type: string
          format: date-time
          description: When sent, forces `status=PUBLISHED`.
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        externalLinks:
          type: array
          maxItems: 50
          items:
            type: string
            format: uri
        documentIds:
          type: array
          maxItems: 50
          description: Ordered document ids; replaces the whole array on update.
          items:
            type: string
            format: uuid
    UpdateArchiveRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; omit a field to leave it untouched. `thumbnail: null`
        clears the thumbnail; `publishedAt: null` clears the publish date without
        forcing `status`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        thumbnail:
          anyOf:
            - type: string
              maxLength: 2048
            - type: 'null'
          description: '`undefined` = leave untouched; `null` = clear thumbnail.'
        type:
          $ref: '#/components/schemas/ArchiveType'
        status:
          $ref: '#/components/schemas/ArchiveStatus'
        publishedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: '`null` = clear the date without forcing `PUBLISHED`; a value overrides `status` and forces `PUBLISHED`.'
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        externalLinks:
          type: array
          maxItems: 50
          items:
            type: string
            format: uri
        documentIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid

    # ---------- upload ----------
    UploadImageRequest:
      type: object
      required: [file]
      properties:
        file:
