  /network-submissions:
    post:
      tags: [NetworkSubmissions]
      operationId: createPublicNetworkSubmission
      summary: Create a network submission (public)
      description: |
        **Public** (`@Public()`, no `x-api-key` required, anonymous). Writes
        **directly to the `networks` table** with `status=REQUEST`,
        `source=PUBLIC` (mirroring the archive/event/story submission pattern —
        there is no separate submission table). Body is validated with the global
        `ValidationPipe` (`whitelist` + `forbidNonWhitelisted` + `transform`), so
        unknown fields (e.g. `status`, `createdBy`, `publishedAt`, `lat`, `lng`)
        → **422**.

        Server-side rules (all surfaced as `422` with
        `errors: [{ field, message }]`):
        - `countryId` must exist; `stateId`, when sent, must belong to `countryId`.
        - `cityId`, when sent, must exist, belong to `countryId`, and (when
          `stateId` is sent) belong to that `stateId`. It is stored as
          `Network.cityId` and preserved through `approve`; no geocoder runs
          (`lat`/`lng` are derived only from `mapsUrl`).
        - `content` is sanitized server-side (strict allowlist); a payload that
          becomes empty after sanitization → **422**.
        - `socialMedia` items must have non-empty `platform` and `url`.

        The backend resolves `countryId`/`stateId` to the `Network`
        `country`/`state` name strings. When `mapsUrl` is provided it is
        resolved server-side into `Network.lat`/`lng` + `Network.embedUrl` (an
        invalid or unresolvable link → **422** `mapsUrl`).

        Only a compact `{ id, status }` is returned — the full row is never
        echoed to the anonymous caller. Review via `GET /networks?filter[status]=REQUEST`;
        approve with `POST /networks/{id}/approve`. Rate-limited per IP to
        **5 requests/minute** → **429** on excess.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicNetworkRequest'
      responses:
        '201':
          description: Submission created (`REQUEST`). Returns only `{ id, status }`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMessage'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [id, status]
                        properties:
                          id:
                            type: string
                            format: uuid
                          status:
                            $ref: '#/components/schemas/NetworkStatus'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

