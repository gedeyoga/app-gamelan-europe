      operationId: getArchive
      summary: Get archive by id
      description: |
        Permission `archive:read`. Member-only (`type=MEMBER`) archives return
        `externalLinks` and `documents` as `null` when the caller lacks member
        access (`canViewPrivate=false`).
      parameters:
        - $ref: '#/components/parameters/IdPath'
